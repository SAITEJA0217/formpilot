<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Test 1 — Basic HTML form</title>
<style>
  body{font:14px/1.5 system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#111}
  h1{font-size:20px} label{display:block;margin:14px 0 4px;font-weight:600}
  input,textarea,select{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;font:inherit}
  button{margin-top:20px;padding:10px 16px;border-radius:6px;border:0;background:#2563eb;color:#fff;font:inherit}
</style>
</head>
<body>
<h1>Test 1 — Basic HTML form</h1>
<p>Every field is labelled with <code>&lt;label for&gt;</code> and carries an <code>autocomplete</code> token.
   This is the easiest case and the detection baseline.</p>

<form id="basic">
  <label for="full-name">Full Name</label>
  <input id="full-name" name="fullName" type="text" autocomplete="name" required />

  <label for="email">Email Address</label>
  <input id="email" name="email" type="email" autocomplete="email" required />

  <label for="phone">Phone Number</label>
  <input id="phone" name="phone" type="tel" autocomplete="tel" />

  <label for="dob">Date of Birth</label>
  <input id="dob" name="dob" type="date" autocomplete="bday" />

  <label for="website">Portfolio URL</label>
  <input id="website" name="website" type="url" />

  <label for="years">Years of Experience</label>
  <input id="years" name="years" type="number" min="0" max="50" />

  <label for="city">City</label>
  <input id="city" name="city" type="text" autocomplete="address-level2" />

  <label for="zip">Postal Code</label>
  <input id="zip" name="zip" type="text" autocomplete="postal-code" />

  <label for="summary">Professional Summary</label>
  <textarea id="summary" name="summary" rows="4" maxlength="800"></textarea>

  <button type="submit">Submit application</button>
</form>
</body>
</html>
